# Calibration: tokenizer at the 'm' (matched-baseline) scale. ~8.4M params incl. EMA codebooks.
model: {embed_dim: 256, codebook: 1024, enc_layers: 0, n_heads: 4, dropout: 0.1, learned_l1: false, fine_drop: 0.5, decay: 0.95}
train: {steps: 300, batch_size: 128, lr: 1.0e-3, warmup: 50, weight_decay: 0.0, ckpt_every: 500, eval_every: 300, eval_n: 1000, seed: 0, log_every: 50}
