# Sudoku tokenizer (ours): same level schedule/codebook as released (12 levels, 16 codes, dim 256),
# level-0 learned cascade disabled (released one is a 5.8M-param stride-89 conv); ~3.2M params.
model: {embed_dim: 256, codebook: 16, n_heads: 4, dropout: 0.3, learned_l1: false, fine_drop: 0.5, decay: 0.99}
train: {steps: 6000, batch_size: 256, lr: 1.0e-3, warmup: 300, weight_decay: 0.0, ckpt_every: 500, eval_every: 1000, eval_n: 2000, seed: 0, log_every: 200}
