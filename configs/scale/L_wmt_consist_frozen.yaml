# Tier L WMT14 De-En (J2-F): as L_wmt_consist (J2), but the trajectories and fixed points come from a frozen copy of the released generator; 2000 steps = control FLOPs.
# Same data order (seed), schedule and training FLOPs across arms.
arm: consist_frozen
consist: {states_per_traj: 4}
train: {steps: 2000, batch_size: 128, lr: 5.0e-05, warmup: 200, min_lr_frac: 0.1, weight_decay: 0.01, beta2: 0.95,
  ckpt_every: 250, eval_every: 500, log_every: 25, seed: 0}
eval: {n_curve: 500}
