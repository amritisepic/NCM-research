# Tier M: AR transformer, same body as M_ncm (d512 x 8), FLOP-matched to M_ncm (70k x 256 windows, ~411 PFLOP;
# NCM costs 4.66x AR per window at this size). Data-matched point = its 15k-step checkpoint (metrics.jsonl).
model: {vocab: 8192, n_layer: 8, n_head: 8, n_embd: 512, dropout: 0.1}
train: {steps: 70000, batch_size: 256, lr: 0.0003, warmup: 500, weight_decay: 0.1, ckpt_every: 1000, eval_every: 5000, eval_n: 1000,
  log_every: 200, seed: 0, snapshot_steps: [15000]}
