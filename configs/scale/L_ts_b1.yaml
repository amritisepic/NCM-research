# Tier L (paper scale): fine-tune the released 88.6M TinyStories generator. B1 full: on-policy corruption + re-quantized labels. FLOP-matched (1350 steps).
# Same data order (seed), schedule and FLOPs across arms; only `corruption` differs.
init: released
corruption: {mode: onpolicy, mean_rate: 0.5, spread: 0.5, retarget: true, policy_temp: 1.0}
train: {steps: 1350, batch_size: 256, grad_accum: 8, lr: 5.0e-05, warmup: 200, min_lr_frac: 0.1, weight_decay: 0.1, beta2: 0.95,
  ckpt_every: 250, eval_every: 300, eval_n: 1000, log_every: 25, compile: false, seed: 0}
sample_eval:
  every: 600
  n: 256
  final_seeds: [42, 0, 1, 2]
  final_n: 256
  mauve: true
