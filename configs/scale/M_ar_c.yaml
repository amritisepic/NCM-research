# Tier M, design C (M1): AR transformer with the same body as M_ncm_c (d512 x 6), FLOP-matched to it by the analytic
# generator proxy (NCM = 4.56x AR per window at this size): 27,335 x 256 windows, ~4.3 CU on an A100.
# Snapshots: 6000 (data-matched to M_ncm_c, secondary) and 20500 (75%, curve only).
model: {vocab: 8192, n_layer: 6, n_head: 8, n_embd: 512, dropout: 0.1}
train: {steps: 27335, batch_size: 256, lr: 0.0003, warmup: 500, weight_decay: 0.1, ckpt_every: 1000, eval_every: 2500, eval_n: 1000,
  log_every: 200, seed: 0, snapshot_steps: [6000, 20500]}
