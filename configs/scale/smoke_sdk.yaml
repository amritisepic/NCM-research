# CPU smoke test for scripts/train_sudoku_L.py (override arm on the command line copy).
arm: repair
model: {dropout: 0.1}
corruption: {mean_rate: 0.5, spread: 0.5}
repair: {max_age: 3, new_lr_mult: 20.0}
train: {steps: 4, batch_size: 8, lr: 5.0e-05, warmup: 2, min_lr_frac: 0.1, weight_decay: 0.01, beta2: 0.99,
  ckpt_every: 2, eval_every: 2, log_every: 1, seed: 0}
eval: {n_val: 8, caps: [2, 4, 8]}
