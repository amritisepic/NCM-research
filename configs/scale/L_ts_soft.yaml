# Tier L (paper scale): fine-tune the released 88.6M TinyStories generator. B7: control + soft labels over the 16 nearest codes of the residual (tau 0.25: ~77% weight on the canonical code, R010).
# Same data order (seed), schedule and FLOPs across arms; only `corruption` differs.
init: released
corruption: {mode: uniform, mean_rate: 0.5, spread: 0.5, retarget: false, soft_tau: 0.25, soft_topm: 16}
train: {steps: 4000, batch_size: 256, grad_accum: 8, lr: 5.0e-05, warmup: 200, min_lr_frac: 0.1, weight_decay: 0.1, beta2: 0.95,
  ckpt_every: 250, eval_every: 500, eval_n: 1000, log_every: 25, compile: false, seed: 0}
sample_eval:
  every: 1000
  n: 256
  final_seeds: [42, 0, 1, 2]
  final_n: 256
  mauve: true
