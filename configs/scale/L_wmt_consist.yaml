# Tier L WMT14 De-En (J1): fine-tune the released 120M NCM. Arm = B2-trained: half batch control loss + half batch self-consistency on the model's own greedy Jacobi trajectories (4 states per trajectory); 2000 steps = control FLOPs.
# Same data order (seed), schedule and training FLOPs across arms.
arm: consist
consist: {states_per_traj: 4}
train: {steps: 2000, batch_size: 128, lr: 5.0e-05, warmup: 200, min_lr_frac: 0.1, weight_decay: 0.01, beta2: 0.95,
  ckpt_every: 250, eval_every: 500, log_every: 25, seed: 0}
eval: {n_curve: 500}
